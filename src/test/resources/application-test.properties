# ============================================================
# Configuration H2 en memoire pour les tests d'integration
# Active via @ActiveProfiles("test")
# ============================================================

# Base de donnees H2 en memoire
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Desactiver SpringFox (evite conflit au demarrage des tests)
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.org.springframework=WARN
logging.level.tn.esprit=DEBUG
